baseURL: https://luchenghuai.github.io/DataScience/
locale: en-us
title: "Data Science Club (BIF)"
theme: ["PaperMod"]

params:
  defaultTheme: dark
  disableThemeToggle: true
  ShowToc: false
  assets:
    favicon: bonsai.jpeg
  socialIcons:
    - name: github
      url: "https://github.com/luchenghuai/DataScience"
  math: true
  profileMode:
    enabled: true
    title: "Data Science Club (BIF)"
    subtitle: "Learning data science through classes, projects, and collaboration"
    imageUrl: "/DataScience/bonsai.jpeg"
    imageWidth: 300
    imageHeight: 300

menu:
  main:
    - identifier: Class
      name: Class
      url: /class/
      weight: 10
    - identifier: Project
      name: Project
      url: /project/
      weight: 20
    - identifier: Submissions
      name: Student Submissions
      url: /submissions/
      weight: 30
    - identifier: Members
      name: COSMOS Members
      url: /members/
      weight: 40
    - identifier: Logs
      name: COSMOS Logs
      url: /logs/
      weight: 50
    - identifier: Photos
      name: COSMOS Photos
      url: /photos/
      weight: 60
    - identifier: course-site
      name: COSMOS Course Website
      url: https://ucd-cosmos-data.github.io/
      weight: 70

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        delimiters:
          block:
          - - $$
            - $$
        enable: true
