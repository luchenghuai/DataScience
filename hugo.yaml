baseURL: https://luchenghuai.github.io/DataScience/
locale: en-us
title: "Data Science Learning Notes"
theme: ["PaperMod"]

params:
  defaultTheme: dark
  disableThemeToggle: true
  ShowToc: false
  assets:
    favicon: bonsai.jpeg
  socialIcons:
    - name: github
      url: "https://github.com/luchenghuai/DataScience"
  math: true
  profileMode:
    enabled: true
    title: "Data Science Learning Notes"
    subtitle: "Lectures, assignments, and projects for learning machine learning"
    imageUrl: "/DataScience/bonsai.jpeg"
    imageWidth: 300
    imageHeight: 300

menu:
  main:
    - identifier: Lectures
      name: Lectures
      url: /class/
      weight: 10
    - identifier: Assignments
      name: Assignments
      url: /submissions/
      weight: 20
    - identifier: Projects
      name: Projects
      url: /project/
      weight: 30

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        delimiters:
          block:
          - - $$
            - $$
        enable: true
